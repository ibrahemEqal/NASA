[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "luna-ready"
version = "0.2.0"
description = "Reconstructed, auditable lunar terrain-horizon research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "rasterio>=1.4", "pyproj>=3.6"]
[project.optional-dependencies]
test = ["pytest>=8"]
science = ["spiceypy>=6"]
[project.scripts]
luna-ready = "luna_ready.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
